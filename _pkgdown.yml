url: https://jdenn0514.github.io/surveywts/

template:
  bootstrap: 5
  bslib:
    font_scale: 1.0
    base_font: {google: "Roboto"}
    code_font: {google: "Inter"}
    heading_font: {google: "Roboto"}
    bg: "#fcfbf9"         # lighten springwood background
    fg: "#000000"         # contrast ratio: 15.76 for text
    primary: "#AA4488"    # periwinkle — links, active states
    navbar-bg: "#EECCDD"  # periwinkle tint — navbar background
    navbar-light-hover-color: "#AA4488"

reference:
  - title: Calibration
    desc: >
      Functions for calibrating survey weights to known population totals.
    contents:
      - calibrate
      - rake
      - poststratify
  - title: Sample-Based Calibration
    desc: >
      Functions for calibrating replicate-weight designs to a control survey or
      to estimated totals with uncertainty.
    contents:
      - calibrate_to_survey
      - calibrate_to_estimate
  - title: Propensity Weighting
    desc: >
      Functions for inverse probability weighting of non-probability samples.
    contents:
      - ipw
  - title: Example Datasets
    desc: >
      Bundled datasets for use in IPW examples and tests.
    contents:
      - ns_wave1_ipw
      - gss_ipw_ref
      - npors_2025_ipw
      - acs_ipw_ref
  - title: Nonresponse Adjustment
    desc: >
      Functions for adjusting survey weights for unit nonresponse.
    contents:
      - adjust_nonresponse
      - redistribute_weights
  - title: Replicate Weights
    desc: >
      Functions for creating replicate weights for variance estimation.
    contents:
      - create_bootstrap_weights
      - create_jackknife_weights
      - create_brr_weights
      - create_gen_boot_weights
      - create_gen_rep_weights
      - create_sdr_weights
      - create_replicate_weights
      - as_taylor_design
  - title: Weight Utilities
    desc: >
      Functions for trimming and stabilizing survey weights.
    contents:
      - trim_weights
      - stabilize_weights
  - title: Diagnostics
    desc: >
      Functions for assessing the distribution and quality of survey weights.
    contents:
      - effective_sample_size
      - weight_variability
      - summarize_weights
